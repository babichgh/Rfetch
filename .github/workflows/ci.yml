name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  # A new push to the same branch makes the in-flight run irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TEMPORARY: the deb matrix job fails at "Build deb" and job logs need admin
  # rights to fetch, so this job reproduces the failure and pushes its output to
  # the ci-debug branch where it can be read.
  deb-debug:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        if: always()
        run: |
          { echo "== pwd =="; pwd
            echo "== ls =="; ls -la
            echo "== tools =="; command -v cargo dpkg-deb bash git
            echo "== cargo =="; cargo --version
            echo "== dpkg-deb =="; dpkg-deb --version
            echo "== free =="; df -h / /tmp
          } > diag.txt 2>&1 || true

      - name: Build
        if: always()
        run: |
          bash packaging/build-deb.sh 0.1.0 dist >> diag.txt 2>&1
          echo "BUILD_EXIT=$?" >> diag.txt
          ls -la dist/ >> diag.txt 2>&1

      - name: Push diag
        if: always()
        run: |
          cat diag.txt
          git config user.email "ci@example.invalid"
          git config user.name  "ci-debug"
          git checkout -q -B ci-debug
          git add -f diag.txt
          git commit -q -m "ci debug output" || true
          git push -q -f origin ci-debug

  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Resolved here rather than in each container job: a step writing to
      # $GITHUB_OUTPUT failed under rust:1-bookworm, and the release workflow
      # already resolves it the same way. One place, one answer.
      - name: Resolve version
        id: v
        run: |
          set -euo pipefail
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- --deny warnings

      - name: Generated logo table is current
        run: python3 tools/generate_logos.py --check

      - name: Test
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

  package-check:
    name: ${{ matrix.name }} builds
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rpm
            image: fedora:44
          - name: deb
            image: rust:1-bookworm
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      # dpkg-deb is already present in rust:1-bookworm, so only rpm needs its
      # tools installed. The redundant apt-get step was the only difference
      # between this job and the release job that builds the same deb.
      - name: Install packaging tools
        if: matrix.name == 'rpm'
        run: dnf install -y cargo rust rpm-build

      - name: Build rpm
        if: matrix.name == 'rpm'
        env:
          V: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p /work/{SOURCES,SPECS,BUILD,RPMS,SRPMS,BUILDROOT}
          tar --exclude=.git --exclude=target \
              --transform "s,^,rfetch-$V/," \
              -czf "/work/SOURCES/rfetch-$V.tar.gz" .
          rpmbuild -ba \
            --define "_topdir /work" \
            --define "rfetch_version $V" \
            --define "_sourcedir /work/SOURCES" \
            --define "_specdir $GITHUB_WORKSPACE/packaging" \
            packaging/rfetch.spec
          mkdir -p dist
          # Only the binary package; debuginfo/debugsource are Fedora-internal.
          cp /work/RPMS/x86_64/rfetch-"$V"-*.x86_64.rpm dist/
          ls -l dist/

      - name: Build deb
        if: matrix.name == 'deb'
        env:
          V: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          bash packaging/build-deb.sh "$V" dist
          ls -l dist/

      - name: Inspect
        if: always()
        run: |
          set -euo pipefail
          ls -l dist/ || true
          if ls dist/*.rpm >/dev/null 2>&1; then
            rpm -qip dist/*.rpm | head -12
            rpm -qlp dist/*.rpm
          fi
          if ls dist/*.deb >/dev/null 2>&1; then
            dpkg-deb -I dist/*.deb
            dpkg-deb -c dist/*.deb
          fi